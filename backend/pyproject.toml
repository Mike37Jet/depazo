[project]
name = "depazo"
version = "0.1.0"
description = "Rental apartment finder for Quito"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.27",
    "typer>=0.15",
]

[project.scripts]
depazo = "depazo.presentation.cli.main:app"

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depazo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "ERA", "PL", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
